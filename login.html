<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhevia Perfumes - Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .login-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 400px;
      padding: 40px 30px;
      text-align: center;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      background: #9c27b0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: white;
      font-size: 36px;
    }
    
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #666;
      font-weight: 500;
    }
    
    .form-group input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #9c27b0;
      box-shadow: 0 0 0 3px rgba(156, 39, 176, 0.2);
    }
    
    .btn-login {
      width: 100%;
      padding: 14px;
      background: #9c27b0;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }
    
    .btn-login:hover {
      background: #7b1fa2;
      transform: translateY(-2px);
    }
    
    .error-message {
      color: #f44336;
      margin-top: 10px;
      font-size: 14px;
      display: none;
    }
    
    .security-tips {
      margin-top: 25px;
      padding: 15px;
      background: #f8f9ff;
      border-radius: 10px;
      text-align: left;
    }
    
    .security-tips h3 {
      color: #9c27b0;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .security-tips ul {
      padding-left: 20px;
      font-size: 14px;
      color: #555;
    }
    
    .security-tips li {
      margin-bottom: 8px;
    }
    
    .footer {
      margin-top: 25px;
      color: #666;
      font-size: 14px;
    }
    
    /* Responsive Design */
    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }
      
      .logo {
        width: 70px;
        height: 70px;
        font-size: 30px;
      }
      
      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <i class="fas fa-wind"></i>
    </div>
    <h1>Rhevia Perfumes Accounting System</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="username"><i class="fas fa-user"></i> Username</label>
        <input type="text" id="username" placeholder="Enter your username" required>
      </div>
      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn-login">Login</button>
      <div id="errorMessage" class="error-message">Invalid username or password. Please try again.</div>
    </form>
    
    <div class="security-tips">
      <h3><i class="fas fa-shield-alt"></i> Security Tips</h3>
      <ul>
        <li>Use a strong, unique password</li>
        <li>Never share your login credentials</li>
        <li>Always log out after your session</li>
        <li>Be cautious of phishing attempts</li>
      </ul>
    </div>
    
    <div class="footer">
      <p>© 2025 Rhevia Perfumes. All rights reserved.</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const loginForm = document.getElementById('loginForm');
      const errorMessage = document.getElementById('errorMessage');
      
      // Simulated database of users (in a real app, this would be on the server)
      const users = [
        { id: 1, username: "admin", password: "SecurePass123!", name: "Administrator", role: "admin" },
        { id: 2, username: "accountant", password: "Rhevia2025!", name: "John Doe", role: "accountant" },
        { id: 3, username: "manager", password: "ManagerPass!", name: "Sarah Smith", role: "manager" }
      ];
      
      // Handle form submission
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        // Find user by credentials
        const user = users.find(u => u.username === username && u.password === password);
        
        if (user) {
          // Successful login - store user session
          sessionStorage.setItem('isAuthenticated', 'true');
          sessionStorage.setItem('user', JSON.stringify({
            id: user.id,
            name: user.name,
            role: user.role,
            loginTime: new Date().toISOString()
          }));
          
          // Redirect to main application
          window.location.href = "Rhevia App Final.html";
        } else {
          // Show error message
          errorMessage.style.display = 'block';
          
          // Clear password field
          document.getElementById('password').value = '';
          
          // Shake animation for error feedback
          loginForm.classList.add('shake');
          setTimeout(() => {
            loginForm.classList.remove('shake');
          }, 500);
        }
      });
      
      // Add shake animation style
      const style = document.createElement('style');
      style.textContent = `
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
          20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake {
          animation: shake 0.5s ease;
        }
      `;
      document.head.appendChild(style);
    });
  </script>
</body>
</html>
